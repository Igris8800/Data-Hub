# Render blueprint for the Data Hub backend (FastAPI). Import this repo in Render via "New → Blueprint".
services:
  - type: web
    name: datahub-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONGO_URL
        sync: false          # paste your MongoDB Atlas connection string
      - key: DB_NAME
        value: datahub
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://data-hub-xyz.vercel.app (comma-separate several)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
